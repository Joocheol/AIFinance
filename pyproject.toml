[project]
name = "aifinance"
version = "0.1.0"
description = "AI로 EDGAR 공시를 수집·DB화·RAG화하여 JP Morgan 구조화 상품을 분석하고 신상품을 설계하는 실무 코스"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "pydantic>=2.7",
    "duckdb>=1.1",
    "fastembed>=0.4",
    "mcp>=1.2",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aifinance"]
